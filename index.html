<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="到点是一款手机优先的本地待办 App，可粘贴群通知并自动提取时间、地点、重要程度和准备事项。"
    />
    <meta name="theme-color" content="#f4f1e8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>到点 · 一句话待办</title>
    
    
    
    <style>
:root {
  --canvas: #f4f1e8;
  --paper: #fffdf8;
  --paper-strong: #ffffff;
  --paper-muted: #ece8dd;
  --ink: #202725;
  --ink-soft: #68716d;
  --ink-faint: #929994;
  --line: #dad6cb;
  --line-strong: #c2beb3;
  --green: #173f3a;
  --green-soft: #dfece8;
  --green-mid: #27695f;
  --orange: #f26f45;
  --orange-soft: #fce3d9;
  --yellow: #f3c35b;
  --yellow-soft: #fbefd2;
  --red: #bd4e4e;
  --red-soft: #f8dede;
  --blue: #4f7894;
  --blue-soft: #e1edf4;
  --shadow: 0 18px 52px rgba(32, 39, 37, 0.12);
  --shadow-small: 0 7px 22px rgba(32, 39, 37, 0.08);
  --radius: 10px;
  --app-width: 720px;
  --header-height: 70px;
  --tabs-height: 66px;
  --dock-height: 84px;
}

* {
  box-sizing: border-box;
}

html {
  min-width: 320px;
  background: var(--canvas);
  color: var(--ink);
  font-family:
    "Microsoft YaHei",
    "PingFang SC",
    "Noto Sans CJK SC",
    system-ui,
    sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}

body {
  min-width: 320px;
  min-height: 100vh;
  margin: 0;
  background: var(--canvas);
}

button,
input,
textarea,
select {
  color: inherit;
  font: inherit;
}

button {
  border: 0;
  cursor: pointer;
}

button:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible,
label.file-button:focus-within {
  outline: 3px solid rgba(79, 120, 148, 0.28);
  outline-offset: 2px;
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.52;
}

svg {
  display: block;
  width: 19px;
  height: 19px;
  stroke-width: 2;
}

[hidden] {
  display: none !important;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  clip-path: inset(50%);
}

.app-frame {
  position: relative;
  width: min(var(--app-width), 100%);
  min-height: 100vh;
  margin: 0 auto;
  background: var(--canvas);
}

.app-header {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  min-height: var(--header-height);
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  border-bottom: 1px solid rgba(218, 214, 203, 0.86);
  background: rgba(244, 241, 232, 0.94);
  padding: calc(10px + env(safe-area-inset-top)) 18px 10px;
  backdrop-filter: blur(18px);
}

.brand {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 11px;
}

.school-logo {
  width: 92px;
  height: 38px;
  flex: 0 0 auto;
  object-fit: contain;
}

.brand-mark {
  display: grid;
  width: 42px;
  height: 42px;
  flex: 0 0 auto;
  place-items: center;
  border-radius: var(--radius);
  background: var(--green);
  color: #fffdf8;
  box-shadow: 0 7px 18px rgba(23, 63, 58, 0.2);
}

.brand-mark svg {
  width: 23px;
  height: 23px;
}

.brand-copy {
  display: grid;
  min-width: 0;
}

.brand-copy strong {
  font-size: 18px;
  line-height: 1.1;
}

.brand-copy small {
  overflow: hidden;
  margin-top: 2px;
  color: var(--ink-soft);
  font-size: 11px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.round-button {
  display: grid;
  width: 40px;
  height: 40px;
  flex: 0 0 auto;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: var(--paper);
  color: var(--ink-soft);
}

.web-download-button {
  text-decoration: none;
}

.round-button:hover {
  border-color: var(--line-strong);
  color: var(--ink);
}

.app-main {
  min-height: calc(100vh - var(--header-height));
  padding: 18px 16px calc(var(--tabs-height) + var(--dock-height) + 28px);
}

.summary-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 1px 2px 14px;
}

.summary-copy h1,
.summary-copy p {
  margin: 0;
}

.summary-copy h1 {
  font-size: 25px;
  letter-spacing: 0;
  line-height: 1.2;
}

.summary-copy p {
  margin-top: 4px;
  color: var(--ink-soft);
  font-size: 12px;
}

.today-pill {
  display: inline-flex;
  min-height: 32px;
  flex: 0 0 auto;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--paper);
  color: var(--ink-soft);
  padding: 5px 10px;
  font-size: 11px;
  font-weight: 750;
}

.today-pill svg {
  width: 14px;
  height: 14px;
}

.next-section {
  margin-bottom: 22px;
}

.next-card {
  position: relative;
  overflow: hidden;
  border-radius: var(--radius);
  background: var(--green);
  color: #fffdf8;
  padding: 18px;
  box-shadow: 0 16px 38px rgba(23, 63, 58, 0.18);
}

.next-card::after {
  position: absolute;
  top: -42px;
  right: -34px;
  width: 130px;
  height: 130px;
  border: 24px solid rgba(255, 255, 255, 0.06);
  border-radius: 50%;
  content: "";
  pointer-events: none;
}

.next-card.is-urgent {
  background: #742f2f;
}

.next-card.is-soon {
  background: #654b1d;
}

.next-card.is-completing {
  animation: next-complete 620ms ease forwards;
  pointer-events: none;
}

.next-card-top {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.next-label {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  color: rgba(255, 255, 255, 0.72);
  font-size: 11px;
  font-weight: 750;
  text-transform: uppercase;
}

.next-label svg {
  width: 15px;
  height: 15px;
}

.countdown-badge {
  display: inline-flex;
  min-height: 27px;
  align-items: center;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.13);
  color: white;
  padding: 4px 9px;
  font-size: 10px;
  font-weight: 800;
}

.countdown-badge.is-pulsing {
  animation: countdown-pulse 1.7s ease-in-out infinite;
}

.next-title {
  position: relative;
  z-index: 1;
  margin: 17px 0 0;
  font-size: 24px;
  line-height: 1.28;
}

.next-meta {
  position: relative;
  z-index: 1;
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 14px;
}

.meta-chip {
  display: inline-flex;
  min-height: 29px;
  align-items: center;
  gap: 6px;
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.08);
  color: rgba(255, 255, 255, 0.9);
  padding: 4px 8px;
  font-size: 10px;
  font-weight: 700;
}

.meta-chip svg {
  width: 13px;
  height: 13px;
}

.next-note {
  position: relative;
  z-index: 1;
  margin: 14px 0 0;
  color: rgba(255, 255, 255, 0.75);
  font-size: 12px;
}

.next-actions {
  position: relative;
  z-index: 1;
  display: flex;
  gap: 8px;
  margin-top: 17px;
}

.next-actions button {
  min-height: 39px;
}

.complete-next-button {
  display: inline-flex;
  flex: 1;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border-radius: 7px;
  background: var(--orange);
  color: white;
  padding: 8px 13px;
  font-size: 12px;
  font-weight: 800;
}

.complete-next-button:hover {
  background: #db5c35;
}

.open-next-button {
  display: inline-grid;
  width: 42px;
  place-items: center;
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 7px;
  background: rgba(255, 255, 255, 0.08);
  color: white;
}

.page-section {
  margin-top: 22px;
}

.section-heading {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
  padding: 0 2px;
}

.section-heading h2,
.section-heading p {
  margin: 0;
}

.section-heading h2 {
  font-size: 16px;
  letter-spacing: 0;
}

.section-heading p {
  margin-top: 2px;
  color: var(--ink-soft);
  font-size: 10px;
}

.sort-control {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--paper);
  color: var(--ink-soft);
  padding: 5px 8px;
  font-size: 10px;
  font-weight: 700;
}

.sort-control svg {
  width: 13px;
  height: 13px;
}

.task-list {
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--paper);
}

.task-item {
  position: relative;
  display: grid;
  max-height: 240px;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: start;
  gap: 12px;
  overflow: hidden;
  border-bottom: 1px solid var(--line);
  padding: 15px 14px;
  background: var(--paper);
  transition:
    opacity 200ms ease,
    background 150ms ease;
}

.task-item:last-child {
  border-bottom: 0;
}

.task-item:hover {
  background: #fbfaf5;
}

.task-item.is-overdue {
  box-shadow: inset 4px 0 0 var(--red);
}

.task-item.is-soon {
  box-shadow: inset 4px 0 0 var(--orange);
}

.task-item.is-completed {
  opacity: 0.55;
}

.task-item.is-completing {
  animation: task-collapse 720ms ease forwards;
  pointer-events: none;
}

.task-check {
  position: relative;
  display: grid;
  width: 30px;
  height: 30px;
  flex: 0 0 auto;
  place-items: center;
  border: 1.5px solid var(--line-strong);
  border-radius: 50%;
  background: var(--paper-strong);
  color: white;
  cursor: pointer;
  transition:
    background 160ms ease,
    border-color 160ms ease,
    transform 160ms ease;
}

.task-check:hover {
  border-color: var(--green-mid);
  transform: scale(1.04);
}

.task-check svg {
  width: 16px;
  height: 16px;
  opacity: 0;
  stroke-dasharray: 24;
  stroke-dashoffset: 24;
}

.task-item.is-completing .task-check,
.task-item.is-completed .task-check {
  border-color: var(--green);
  background: var(--green);
}

.task-item.is-completing .task-check {
  animation: check-pop 380ms cubic-bezier(0.22, 1.5, 0.5, 1);
}

.task-item.is-completing .task-check svg,
.task-item.is-completed .task-check svg {
  opacity: 1;
  stroke-dashoffset: 0;
}

.task-item.is-completing .task-check svg {
  animation: draw-check 360ms 80ms ease forwards;
}

.task-main {
  min-width: 0;
  cursor: pointer;
}

.task-title-row {
  display: flex;
  min-width: 0;
  align-items: flex-start;
  justify-content: space-between;
  gap: 9px;
}

.task-title {
  position: relative;
  display: inline;
  margin: 0;
  font-size: 14px;
  font-weight: 800;
  line-height: 1.45;
}

.task-title::after {
  position: absolute;
  top: 53%;
  left: 0;
  width: 0;
  height: 1.5px;
  background: currentColor;
  content: "";
  pointer-events: none;
}

.task-item.is-completing .task-title::after {
  animation: strike-through 380ms 100ms ease forwards;
}

.task-item.is-completed .task-title::after {
  width: 100%;
}

.priority-pill {
  display: inline-flex;
  min-height: 22px;
  flex: 0 0 auto;
  align-items: center;
  border-radius: 999px;
  padding: 2px 7px;
  font-size: 9px;
  font-weight: 850;
  white-space: nowrap;
}

.priority-pill.high {
  background: var(--red-soft);
  color: var(--red);
}

.priority-pill.medium {
  background: var(--yellow-soft);
  color: #8a5c05;
}

.priority-pill.low {
  background: var(--blue-soft);
  color: var(--blue);
}

.task-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 5px 10px;
  margin-top: 7px;
  color: var(--ink-soft);
  font-size: 10px;
}

.task-meta span {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.task-meta svg {
  width: 12px;
  height: 12px;
}

.task-meta .overdue-text {
  color: var(--red);
  font-weight: 800;
}

.task-note-preview {
  display: -webkit-box;
  overflow: hidden;
  margin: 7px 0 0;
  color: var(--ink-soft);
  font-size: 10px;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 1;
}

.mini-step-list {
  display: grid;
  gap: 4px;
  margin-top: 8px;
}

.mini-step {
  display: flex;
  width: 100%;
  min-height: 27px;
  align-items: center;
  gap: 7px;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #fbfaf5;
  color: var(--ink-soft);
  padding: 4px 7px;
  font-size: 10px;
  text-align: left;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.mini-step:hover {
  border-color: #9dc0b8;
  background: var(--green-soft);
  color: var(--green);
}

.mini-step > span {
  display: grid;
  width: 16px;
  height: 16px;
  flex: 0 0 auto;
  place-items: center;
  border: 1px solid var(--line-strong);
  border-radius: 50%;
  background: white;
}

.mini-step svg {
  width: 10px;
  height: 10px;
  opacity: 0;
}

.mini-step-more {
  color: var(--ink-faint);
  font-size: 9px;
}

.task-actions {
  display: grid;
  gap: 5px;
  justify-items: end;
}

.task-undo-button {
  display: inline-flex;
  min-height: 30px;
  align-items: center;
  gap: 5px;
  border: 1px solid #c8d9d4;
  border-radius: 6px;
  background: var(--green-soft);
  color: var(--green);
  padding: 4px 8px;
  font-size: 9px;
  font-weight: 850;
  white-space: nowrap;
}

.task-undo-button:hover {
  background: #d3e9e3;
}

.task-undo-button svg {
  width: 13px;
  height: 13px;
}

.mini-icon-button {
  display: grid;
  width: 30px;
  height: 30px;
  place-items: center;
  border-radius: 6px;
  background: transparent;
  color: var(--ink-faint);
}

.mini-icon-button:hover {
  background: var(--paper-muted);
  color: var(--ink);
}

.mini-icon-button.danger:hover {
  background: var(--red-soft);
  color: var(--red);
}

.mini-icon-button svg {
  width: 15px;
  height: 15px;
}

.empty-state {
  display: grid;
  min-height: 230px;
  place-items: center;
  border: 1px dashed var(--line-strong);
  border-radius: var(--radius);
  background: rgba(255, 253, 248, 0.6);
  padding: 30px 20px;
  text-align: center;
}

.empty-state > div {
  max-width: 330px;
}

.empty-icon {
  display: grid;
  width: 54px;
  height: 54px;
  margin: 0 auto 13px;
  place-items: center;
  border-radius: 50%;
  background: var(--green-soft);
  color: var(--green);
}

.empty-icon svg {
  width: 25px;
  height: 25px;
}

.empty-state h2,
.empty-state p {
  margin: 0;
}

.empty-state h2 {
  font-size: 17px;
}

.empty-state p {
  margin-top: 5px;
  color: var(--ink-soft);
  font-size: 12px;
}

.empty-state .secondary-button {
  margin-top: 15px;
}

.loading-strip {
  display: flex;
  min-height: 74px;
  align-items: center;
  gap: 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--paper);
  padding: 13px;
}

.loading-strip .spinner {
  width: 24px;
  height: 24px;
  flex: 0 0 auto;
  border: 3px solid var(--green-soft);
  border-top-color: var(--green);
  border-radius: 50%;
  animation: spin 750ms linear infinite;
}

.loading-strip p,
.loading-strip strong {
  display: block;
  margin: 0;
}

.loading-strip p {
  color: var(--ink-soft);
  font-size: 10px;
}

.loading-strip strong {
  font-size: 13px;
}

.task-tabs {
  position: fixed;
  right: 0;
  bottom: calc(var(--dock-height) + env(safe-area-inset-bottom));
  left: 50%;
  z-index: 45;
  display: grid;
  width: min(var(--app-width), 100%);
  height: var(--tabs-height);
  grid-template-columns: repeat(3, 1fr);
  transform: translateX(-50%);
  border-top: 1px solid var(--line);
  background: rgba(255, 253, 248, 0.96);
  padding: 6px 10px;
  backdrop-filter: blur(18px);
}

.task-tab {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 2px;
  border-radius: 7px;
  background: transparent;
  color: var(--ink-soft);
  font-size: 9px;
  font-weight: 700;
}

.task-tab svg {
  width: 18px;
  height: 18px;
}

.task-tab b {
  position: absolute;
  top: 1px;
  right: calc(50% - 28px);
  display: inline-flex;
  min-width: 17px;
  height: 17px;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
  background: var(--orange);
  color: white;
  font-size: 9px;
}

.task-tab.is-active {
  color: var(--green);
}

.task-tab.is-active svg {
  stroke-width: 2.5;
}

.capture-dock {
  position: fixed;
  right: 0;
  bottom: 0;
  left: 50%;
  z-index: 50;
  width: min(var(--app-width), 100%);
  min-height: calc(var(--dock-height) + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  border-top: 1px solid rgba(218, 214, 203, 0.9);
  background: rgba(244, 241, 232, 0.96);
  padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
  backdrop-filter: blur(18px);
}

.capture-button {
  display: grid;
  width: 100%;
  min-height: 58px;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 11px;
  border-radius: var(--radius);
  background: var(--green);
  color: white;
  padding: 8px 12px;
  text-align: left;
  box-shadow: 0 10px 28px rgba(23, 63, 58, 0.2);
  transition:
    background 150ms ease,
    transform 150ms ease;
}

.capture-button:hover {
  background: #0f332f;
}

.capture-button:active {
  transform: translateY(1px);
}

.capture-button > svg {
  color: rgba(255, 255, 255, 0.65);
}

.capture-plus {
  display: grid;
  width: 38px;
  height: 38px;
  place-items: center;
  border-radius: 7px;
  background: var(--orange);
}

.capture-plus svg {
  width: 20px;
  height: 20px;
}

.capture-button strong,
.capture-button small {
  display: block;
}

.capture-button strong {
  font-size: 12px;
}

.capture-button small {
  overflow: hidden;
  margin-top: 1px;
  color: rgba(255, 255, 255, 0.65);
  font-size: 9px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.sheet-backdrop {
  position: fixed;
  inset: 0;
  z-index: 80;
  background: rgba(24, 30, 28, 0.46);
  backdrop-filter: blur(2px);
}

.sheet-root {
  position: fixed;
  inset: 0;
  z-index: 90;
  display: none;
  align-items: flex-end;
  justify-content: center;
  pointer-events: none;
}

.sheet-root.is-open {
  display: flex;
}

.bottom-sheet {
  display: flex;
  width: min(var(--app-width), 100%);
  max-height: min(92dvh, 900px);
  flex-direction: column;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.35);
  border-radius: 18px 18px 0 0;
  background: var(--paper);
  box-shadow: var(--shadow);
  pointer-events: auto;
  animation: sheet-up 240ms cubic-bezier(0.22, 0.85, 0.3, 1);
}

@keyframes countdown-pulse {
  0%,
  100% {
    opacity: 1;
  }
  50% {
    opacity: 0.58;
  }
}

@keyframes check-pop {
  0% {
    transform: scale(0.9);
  }
  55% {
    transform: scale(1.18);
  }
  100% {
    transform: scale(1);
  }
}

@keyframes draw-check {
  from {
    stroke-dashoffset: 24;
  }
  to {
    stroke-dashoffset: 0;
  }
}

@keyframes strike-through {
  from {
    width: 0;
  }
  to {
    width: 100%;
  }
}

@keyframes task-collapse {
  0%,
  42% {
    max-height: 240px;
    opacity: 1;
    transform: translateY(0);
  }
  72% {
    max-height: 115px;
    opacity: 0.55;
    transform: translateY(1px);
  }
  100% {
    max-height: 0;
    border-bottom-width: 0;
    opacity: 0;
    padding-top: 0;
    padding-bottom: 0;
    transform: translateY(-4px);
  }
}

@keyframes sheet-up {
  from {
    opacity: 0;
    transform: translateY(32px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes toast-in {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

@keyframes next-complete {
  0%,
  45% {
    opacity: 1;
    transform: translateY(0);
  }
  100% {
    opacity: 0.45;
    transform: translateY(5px) scale(0.985);
  }
}

@media (min-width: 721px) {
  body {
    background: var(--canvas);
  }

  .app-frame {
    border-right: 1px solid var(--line);
    border-left: 1px solid var(--line);
    box-shadow: 0 0 60px rgba(32, 39, 37, 0.07);
  }

  .app-main {
    padding-right: 24px;
    padding-left: 24px;
  }

  .bottom-sheet {
    width: min(620px, calc(100% - 30px));
    margin-bottom: 16px;
    border-radius: 14px;
  }

  .sheet-root {
    align-items: center;
  }
}

@media (max-width: 390px) {
  .app-main {
    padding-right: 12px;
    padding-left: 12px;
  }

  .app-header {
    padding-right: 13px;
    padding-left: 13px;
  }

  .brand-copy small {
    max-width: 170px;
  }

  .summary-copy h1 {
    font-size: 22px;
  }

  .next-card {
    padding: 15px;
  }

  .next-title {
    font-size: 21px;
  }

  .task-item {
    gap: 9px;
    padding: 13px 11px;
  }

  .task-actions {
    gap: 2px;
  }

  .form-row {
    grid-template-columns: 1fr;
  }

  .step-subfields {
    grid-template-columns: 1fr 1fr;
    padding-left: 0;
  }

  .step-subfields label:last-child {
    grid-column: 1 / -1;
  }

  .step-detail-grid {
    grid-template-columns: 1fr;
  }

  .attention-grid {
    grid-template-columns: 1fr;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
  }
}

function uid(prefix = "task") {
  if (window.crypto?.randomUUID) return `${prefix}-${window.crypto.randomUUID()}`;
  return `${prefix}-${Date.now()}-${Math.random().toString(16).slice(2)}`;
}

function pad(value) {
  return String(value).padStart(2, "0");
}

function toIsoDate(date) {
  return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
}

function todayIso() {
  return toIsoDate(new Date());
}

function parseIsoDate(value) {
  const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value || "");
  if (!match) return null;
  const date = new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]), 12, 0, 0, 0);
  return Number.isNaN(date.getTime()) ? null : date;
}

function formatDate(value, detail = false) {
  const date = parseIsoDate(value);
  if (!date) return "未设置日期";
  const today = parseIsoDate(todayIso());
  const diff = Math.round((date - today) / 86400000);
  if (diff === 0) return "今天";
  if (diff === 1) return "明天";
  if (diff === 2) return "后天";
  if (diff === -1) return "昨天";
  if (diff < 0) return `逾期 ${Math.abs(diff)} 天`;
  if (diff > 2 && diff < 7) return `${diff} 天后`;
  if (detail) {
    return new Intl.DateTimeFormat("zh-CN", {
      month: "long",
      day: "numeric",
      weekday: "short",
    }).format(date);
  }
  return `${date.getMonth() + 1}月${date.getDate()}日`;
}

function formatFullDate(value) {
  const date = parseIsoDate(value);
  if (!date) return "未设置";
  return new Intl.DateTimeFormat("zh-CN", {
    year: "numeric",
    month: "long",
    day: "numeric",
    weekday: "long",
  }).format(date);
}

function getNextStep(task) {
  const pending = task.checklist.filter((item) => !item.done);
  const dated = pending
    .filter((item) => item.date)
    .sort((a, b) => {
      const aValue = `${a.date}T${a.time || "23:59"}`;
      const bValue = `${b.date}T${b.time || "23:59"}`;
      return aValue.localeCompare(bValue);
    });
  return dated[0] || pending[0] || null;
}

function taskProgress(task) {
  const total = task.checklist.length;
  const done = task.checklist.filter((item) => item.done).length;
  return {
    done,
    total,
    percent: total ? Math.round((done / total) * 100) : task.status === "done" ? 100 : 0,
  };
}

  const date = parseIsoDate(
    nextStep?.endDate || nextStep?.date || task.endDate || task.startDate
  );
  if (!date) return null;
  const time =
    nextStep?.endTime ||
    nextStep?.time ||
    task.endTime ||
    task.startTime ||
    "23:59";
  const [hours, minutes] = time.split(":").map(Number);
  date.setHours(Number.isFinite(hours) ? hours : 23, Number.isFinite(minutes) ? minutes : 59, 0, 0);
  return date;
}

function taskEndDateTime(task) {
  const date = parseIsoDate(task.endDate || task.startDate);
  if (!date) return null;
  const time = task.endTime || task.startTime || "23:59";
  const [hours, minutes] = time.split(":").map(Number);
  date.setHours(Number.isFinite(hours) ? hours : 23, Number.isFinite(minutes) ? minutes : 59, 0, 0);
  return date;
}

function minutesUntil(task) {
  const target = taskDateTime(task);
  if (!target) return Number.POSITIVE_INFINITY;
  return Math.round((target - new Date()) / 60000);
}

function formatCountdown(task) {
  if (task.status === "done") return "已完成";
  const endTime = taskEndDateTime(task);
  if (task.taskType === "线上会议" && endTime && endTime < new Date()) return "已结束";
  const minutes = minutesUntil(task);
  if (!Number.isFinite(minutes)) return "未设置时间";
  if (minutes < -1440) return `逾期 ${Math.ceil(Math.abs(minutes) / 1440)} 天`;
  if (minutes < 0) return `已逾期 ${Math.abs(minutes)} 分钟`;
  if (minutes === 0) return "现在开始";
  if (minutes < 60) return `${minutes} 分钟后`;
  if (minutes < 1440) {
    const hours = Math.floor(minutes / 60);
    const rest = minutes % 60;
    return rest ? `${hours} 小时 ${rest} 分后` : `${hours} 小时后`;
  }
  return `${Math.ceil(minutes / 1440)} 天后`;
}

function escapeHtml(value = "") {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function icon(name) {
  return `<i data-lucide="${name}"></i>`;
}

function refreshIcons() {
  window.lucide?.createIcons({
    attrs: {
      "stroke-width": 2,
      "aria-hidden": "true",
    },
  });
}

function normalizeText(text = "") {
  return String(text)
    .replaceAll("：", ":")
    .replaceAll("－", "-")
    .replaceAll("—", "-")
    .replaceAll("～", "-")
    .replaceAll("~", "-")
    .replace(/[０-９]/g, (digit) => String.fromCharCode(digit.charCodeAt(0) - 65248));
}

function stripLeadingSymbols(text = "") {
  return String(text)
    .replace(/^[\s@#*\-•·⏰🏫⚠️☀️🌞\p{Extended_Pictographic}\uFE0F]+/u, "")
    .trim();
}

function normalizeTime(hour, minute, marker = "") {
  let normalizedHour = Number(hour);
  const normalizedMinute = Number(minute || 0);
  if (!Number.isFinite(normalizedHour) || normalizedHour > 23 || normalizedMinute > 59) return "";
  const pmMarker = /下午|晚上|傍晚|中午/.test(marker);
  const amMarker = /上午|早上|凌晨/.test(marker);
  if (!amMarker && normalizedHour > 0 && normalizedHour < 8) normalizedHour += 12;
  if (pmMarker && normalizedHour > 0 && normalizedHour < 12) normalizedHour += 12;
  return `${pad(normalizedHour)}:${pad(normalizedMinute)}`;
}

function parseTimeRange(text = "") {
  const value = normalizeText(text);
  const match =
    /(上午|早上|中午|下午|晚上|傍晚|凌晨)?\s*(\d{1,2})(?::|点|时)(\d{1,2})?分?\s*(?:到|至|-)\s*(上午|早上|中午|下午|晚上|傍晚|凌晨)?\s*(\d{1,2})(?::|点|时)(\d{1,2})?分?/.exec(
      value
    );
  if (!match) return null;
  return {
    start: normalizeTime(match[2], match[3], match[1]),
    end: normalizeTime(match[5], match[6], match[4] || match[1]),
  };
}

function parseAllTimeRanges(text = "") {
  const value = normalizeText(text);
  const pattern =
    /(上午|早上|中午|下午|晚上|傍晚|凌晨)?\s*(\d{1,2})(?::|点|时)(\d{1,2})?分?\s*(?:到|至|-)\s*(上午|早上|中午|下午|晚上|傍晚|凌晨)?\s*(\d{1,2})(?::|点|时)(\d{1,2})?分?/g;
  const ranges = [];
  let match;
  while ((match = pattern.exec(value))) {
    ranges.push({
      raw: match[0],
      start: normalizeTime(match[2], match[3], match[1]),
      end: normalizeTime(match[5], match[6], match[4] || match[1]),
      index: match.index,
    });
  }
  return ranges;
}

function weekdayIndex(value) {
  return { 日: 0, 天: 0, 一: 1, 二: 2, 三: 3, 四: 4, 五: 5, 六: 6 }[value];
}

function parseDateFromText(text, baseDate = new Date()) {
  const value = normalizeText(text);
  const explicit =
    /(?:(\d{4})年)?\s*(\d{1,2})月\s*(\d{1,2})日/.exec(value) ||
    /(?:(\d{4})[\/-])?(\d{1,2})[\/-](\d{1,2})/.exec(value);

  if (explicit) {
    const currentYear = baseDate.getFullYear();
    const year = Number(explicit[1] || currentYear);
    const month = Number(explicit[2]);
    const day = Number(explicit[3]);
    let date = new Date(year, month - 1, day, 12, 0, 0, 0);
    if (!explicit[1]) {
      const cutoff = new Date(baseDate);
      cutoff.setDate(cutoff.getDate() - 7);
      if (date < cutoff) date = new Date(currentYear + 1, month - 1, day, 12, 0, 0, 0);
    }
    if (!Number.isNaN(date.getTime())) {
      return { date: toIsoDate(date), source: explicit[0].trim(), explicit: true };
    }
  }

  const relativeMatch = /(大后天|后天|明天|今天)/.exec(value);
  if (relativeMatch) {
    const date = new Date(baseDate);
    const offset = { 今天: 0, 明天: 1, 后天: 2, 大后天: 3 }[relativeMatch[1]];
    date.setDate(date.getDate() + offset);
    return { date: toIsoDate(date), source: relativeMatch[1], explicit: false };
  }

  const weekMatch = /(本周|这周|下周|周|星期)([一二三四五六日天])/.exec(value);
  if (weekMatch) {
    const modifier = weekMatch[1];
    const targetWeekday = weekdayIndex(weekMatch[2]);
    const monday = new Date(baseDate);
    monday.setHours(12, 0, 0, 0);
    const currentWeekday = (monday.getDay() + 6) % 7;
    monday.setDate(monday.getDate() - currentWeekday);
    const weekOffset = modifier === "下周" ? 7 : 0;
    const date = new Date(monday);
    date.setDate(monday.getDate() + weekOffset + targetWeekday);
    return { date: toIsoDate(date), source: `${modifier}${weekMatch[2]}`, explicit: false };
  }

  return { date: todayIso(), source: "未写明日期，默认今天", explicit: false };
}

function departmentWindow(text, department) {
  const normalized = normalizeText(text);
  const ranges = parseAllTimeRanges(normalized);
  const escapedDepartment = department.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const lines = normalized.split(/\n+/);
  const departmentLine = lines.find(
    (line) => line.includes(department) && /\d{1,2}:\d{2}\s*-\s*\d{1,2}:\d{2}/.test(line)
  );

  if (departmentLine) {
    const range = parseTimeRange(departmentLine);
    if (range) return { ...range, specific: true, line: departmentLine.trim() };
  }

  const inlineDepartmentRange = new RegExp(
    `(\\d{1,2}:\\d{2}\\s*-\\s*\\d{1,2}:\\d{2})\\s*${escapedDepartment}`
  ).exec(normalized);
  if (inlineDepartmentRange) {
    const range = parseTimeRange(inlineDepartmentRange[1]);
    if (range) {
      return { ...range, specific: true, line: inlineDepartmentRange[0] };
    }
  }

  const overallLine = lines.find((line) => /时间\s*:/.test(line));
  const overall = parseTimeRange(overallLine || normalized);
  if (overall) return { ...overall, specific: false, line: overallLine?.trim() || "" };
  if (ranges[0]) return { ...ranges[0], specific: false, line: ranges[0].raw };
  return { start: "", end: "", specific: false, line: "" };
}

function subtractMinutes(time, minutes) {
  if (!time) return "";
  const [hours, mins] = time.split(":").map(Number);
  const date = new Date(2020, 0, 1, hours, mins, 0, 0);
  date.setMinutes(date.getMinutes() - Number(minutes || 0));
  return `${pad(date.getHours())}:${pad(date.getMinutes())}`;
}

function parseLocation(text = "") {
  const value = normalizeNoticeText(text);
  const explicit =
    /【活动地点】\s*([^\n]+)/u.exec(value)?.[1] ||
    /(?:活动)?地点\s*:\s*([^\n]+)/u.exec(value)?.[1];
  if (explicit) return stripLeadingSymbols(explicit).replace(/[。；;]+$/, "").trim();

  const patterns = [
    /在([^，,。；;\n的]{2,20})(?:的时候|时)(?:[，,。；;\n]|$)/u,
    /在([^，,。；;\n]{2,20}?)(?:集合|集中|考勤|等候|报到|参加|进行|举办|开展|举行|办理)/u,
    /到([^，,。；;\n]{2,20}?)(?:集合|集中|考勤|等候|报到|参加|进行|报到)/u,
    /(?:前往|位于|会场在|活动在)([^，,。；;\n的]{2,20})/u,
    /在([^，,。；;\n]{2,20}?)的(?:专题|主题|活动|会议|宣讲|比赛|课程|培训)/u,
  ];
  for (const pattern of patterns) {
    const match = pattern.exec(value);
    if (!match) continue;
    const location = stripLeadingSymbols(match[1]).trim();
    if (/^(这里|那里|此|该|这种|相关|指定|规定)/.test(location)) continue;
    return location;
  }
  return "";
}

function extractAttentionNotes(text = "") {
  const value = normalizeNoticeText(text);
  const notes = [];
  const add = (category, note) => {
    const normalizedNote = String(note || "").trim();
    if (normalizedNote && !notes.some((item) => item.text === normalizedNote)) {
      notes.push({ category, text: normalizedNote });
    }
  };

  const carryPatterns = [
    /携带([^，,。；;\n]+)/gu,
    /(?:记得|需要|请)?带(?:好|上)?([^，,。；;\n]+)/gu,
  ];
  carryPatterns.forEach((pattern) => {
    for (const match of value.matchAll(pattern)) {
      add("携带物品", `携带${match[1].replace(/前往|到场.*$/, "").trim()}`);
    }
  });

  for (const match of value.matchAll(/(?:统一|规范)?穿([^，,。；;\n]+)/gu)) {
    add("着装要求", `穿${match[1].replace(/前往|到场.*$/, "").trim()}`);
  }

  const early = /提前\s*(\d+)\s*分钟(?:进场|入场|到达|到场)?/u.exec(value);
  if (early) add("到场要求", `提前 ${early[1]} 分钟进场完毕`);
  if (/手机.{0,12}(静音|震动)/u.test(value)) add("现场纪律", "手机调整为静音或震动模式");
  if (/不要提前聚集|请勿.*聚集|避免.*拥堵/u.test(value)) add("现场秩序", "错峰、有序到场，不要提前聚集");
  if (/不要.*迟到|请勿迟到/u.test(value)) add("到场要求", "按时参加，不要迟到");

  const rowMatches = value.matchAll(/(第[一二三四五六七八九十\d、至到\-]+排)为([一二三四五六七八九十\d]+班)/gu);
  for (const match of rowMatches) {
    add("座位安排", `${match[1]}为${match[2]}`);
  }
  if (/第一排空着/u.test(value)) add("座位安排", "第一排空着");
  if (/坐不下.{0,12}往后排/u.test(value)) add("座位安排", "坐不下时依次往后排坐");
  if (/尽量坐在中间|坐在中间/u.test(value)) add("座位安排", "尽量坐在中间区域");
  if (/试点班同学|高年级其他同学/u.test(value)) add("角色安排", "试点班同学和高年级其他同学可坐左右两侧区域前排");

  return notes.slice(0, 20);
}

function buildConditionalTask(question, yesStep, options = {}) {
  const id = `condition-${String(question)
    .replace(/[^\u4e00-\u9fa5A-Za-z0-9]+/g, "-")
    .slice(0, 36)}`;
  return {
    id,
    question,
    triggerText: options.triggerText || "",
    options: [
      {
        value: "yes",
        label: options.yesLabel || "是",
        step: yesStep || null,
      },
      {
        value: "no",
        label: options.noLabel || "否",
        step: options.noStep || null,
      },
      {
        value: "unknown",
        label: "不确定",
        step: {
          text: options.unknownText || `确认：${question}`,
          done: false,
        },
      },
    ],
  };
}

function parseRequirements(text = "") {
  const normalized = normalizeText(text);
  const noteSection =
    /(?:注意|要求|须知)\s*:\s*([\s\S]*?)(?:\n\s*\n|此次|$)/.exec(normalized)?.[1] ||
    normalized;
  const requirements = [];

  const carryMatches = [
    ...noteSection.matchAll(/携带([^，,。；;\n、]+)/g),
    ...noteSection.matchAll(/(?:^|[。；;，,])\s*(?:请|需要|记得)?带([^，,。；;\n、]+)/g),
  ];
  carryMatches.forEach((match) => requirements.push(`携带${match[1].trim()}`));

  const wearMatches = noteSection.matchAll(/(?:统一)?穿([^，,。；;\n、]+)/g);
  [...wearMatches].forEach((match) => {
    const item = match[1].replace(/前往|到场|参加.*$/, "").trim();
    if (item) requirements.push(`穿${item}`);
  });

  const earlyMatch = /提前\s*(\d+)\s*分钟/.exec(noteSection);
  if (earlyMatch) requirements.push(`提前 ${earlyMatch[1]} 分钟到达`);

  noteSection
    .split(/[。；;\n]/)
    .map((sentence) => sentence.trim())
    .filter((sentence) => /^(务必|必须|不要|禁止|请|需要)/.test(sentence))
    .forEach((sentence) => {
      const duplicatesExisting =
        requirements.some((item) => sentence.includes(item.replace(/^携带|^穿/, ""))) ||
        (/提前\s*\d+\s*分钟/.test(sentence) &&
          requirements.some((item) => /提前\s*\d+\s*分钟/.test(item)));
      if (!duplicatesExisting) {
        requirements.push(sentence.replace(/^请各位同学|^请新生/, "").trim());
      }
    });

  return [...new Set(requirements.filter(Boolean))].slice(0, 8);
}

function chineseNumberToArabic(value = "") {
  if (!value) return "";
  if (/^\d+$/.test(value)) return value;
  const digits = { 零: 0, 〇: 0, 一: 1, 二: 2, 两: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8, 九: 9 };
  let total = 0;
  let current = 0;
  for (const char of value) {
    if (char in digits) {
      current = digits[char];
    } else if (char === "十") {
      total += (current || 1) * 10;
      current = 0;
    } else if (char === "百") {
      total += (current || 1) * 100;
      current = 0;
    }
  }
  return String(total + current);
}

function normalizeChineseNumerals(text = "") {
  let value = String(text);
  const numeral = "[零〇一二两三四五六七八九十百]+";

  value = value.replace(new RegExp(`差(${numeral})分(${numeral})点`, "g"), (_, minute, hour) => {
    const total = Number(chineseNumberToArabic(hour)) * 60 - Number(chineseNumberToArabic(minute));
    const normalized = (total + 1440) % 1440;
    return `${pad(Math.floor(normalized / 60))}:${pad(normalized % 60)}`;
  });

  value = value.replace(new RegExp(`(${numeral})点(半|(${numeral})分?)?`, "g"), (_, hour, minutePart, minute) => {
    const normalizedHour = chineseNumberToArabic(hour);
    const normalizedMinute = minutePart === "半" ? 30 : minute ? chineseNumberToArabic(minute) : 0;
    return `${normalizedHour}:${pad(normalizedMinute)}`;
  });

  value = value.replace(new RegExp(`(${numeral})(?=[月日号])`, "g"), (match) => chineseNumberToArabic(match));
  value = value.replace(new RegExp(`(${numeral})(?=[张份个名次人分]|分钟)`, "g"), (match) => chineseNumberToArabic(match));
  return value;
}

function normalizeTimeValue(value = "") {
  const normalized = normalizeChineseNumerals(normalizeNoticeText(value))
    .replace(/[：]/g, ":")
    .trim();
  const match = /^(\d{1,2})(?::?(\d{2}))?$/.exec(normalized);
  if (!match) return "";
  const hours = Number(match[1]);
  const minutes = Number(match[2] || 0);
  if (hours > 23 || minutes > 59) return "";
  return `${pad(hours)}:${pad(minutes)}`;
}

function normalizeNoticeText(text = "") {
  return normalizeChineseNumerals(String(text))
    .replace(/&#x20;/gi, " ")
    .replace(/[\u200B-\u200D\uFEFF]/g, "")
    .replace(/：/g, ":")
    .replace(/－|—|～|~/g, "-")
    .replace(/\r/g, "")
    .replace(/[ \t]+/g, " ")
    .trim();
}

function cleanTitleText(text = "") {
  return normalizeNoticeText(text)
    .replace(/[\p{Extended_Pictographic}\uFE0F]/gu, "")
    .replace(/^@所有人[\s:：]*/u, "")
    .replace(/^(同学们好|同学们|大家好|打扰啦|打扰了|各位同学)[！!，,。；;\s]*/u, "")
    .replace(/^(转校[^）)\n]+通知[）)]?)/u, "")
    .replace(/\s+/g, " ")
    .replace(/[。；;]+$/, "")
    .trim();
}

function messageTimestamp(text) {
  const firstLines = normalizeNoticeText(text).split("\n").slice(0, 4).join("\n");
  const match = /(20\d{2})年\s*(\d{1,2})月\s*(\d{1,2})日\s+(\d{1,2}):(\d{2})/.exec(firstLines);
  if (!match) return null;
  const date = new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]), Number(match[4]), Number(match[5]));
  return Number.isNaN(date.getTime()) ? null : date;
}

function dateFromLine(line, baseDate = new Date()) {
  const value = normalizeNoticeText(line);
  const explicit = /(?:(\d{4})年)?\s*(\d{1,2})月\s*(\d{1,2})[日号]/u.exec(value);
  const relative = /(大后天|后天|明天|今天)/u.exec(value);
  const week = /(本周|这周|下周|周|星期)([一二三四五六日天])/u.exec(value);
  let explicitDate = null;
  let relativeDate = null;
  let weekDate = null;

  if (explicit) {
    const currentYear = baseDate.getFullYear();
    const year = Number(explicit[1] || currentYear);
    const month = Number(explicit[2]);
    const day = Number(explicit[3]);
    const candidate = new Date(year, month - 1, day, 12, 0, 0, 0);
    if (!explicit[1] && candidate.getTime() < baseDate.getTime() - 31 * 86400000) {
      candidate.setFullYear(currentYear + 1);
    }
    if (!Number.isNaN(candidate.getTime())) explicitDate = candidate;
  }

  if (relative) {
    relativeDate = new Date(baseDate);
    relativeDate.setHours(12, 0, 0, 0);
    relativeDate.setDate(relativeDate.getDate() + { 今天: 0, 明天: 1, 后天: 2, 大后天: 3 }[relative[1]]);
  }

  if (week) {
    const monday = new Date(baseDate);
    monday.setHours(12, 0, 0, 0);
    monday.setDate(monday.getDate() - ((monday.getDay() + 6) % 7));
    weekDate = new Date(monday);
    weekDate.setDate(monday.getDate() + (week[1] === "下周" ? 7 : 0) + weekdayIndex(week[2]));
  }

  const chosen = explicitDate || relativeDate || weekDate;
  if (!chosen) return null;
  const candidates = [explicitDate, relativeDate, weekDate].filter(Boolean);
  const uniqueDates = [...new Set(candidates.map(toIsoDate))];
  return {
    date: toIsoDate(chosen),
    source: explicit?.[0] || relative?.[1] || `${week[1]}${week[2]}`,
    explicit: Boolean(explicitDate),
    conflict: uniqueDates.length > 1 ? `通知中的日期表达不一致：${uniqueDates.join("、")}` : "",
  };
}

function findDates(text, baseDate = new Date()) {
  return normalizeNoticeText(text)
    .split("\n")
    .map((line, index) => {
      const parsed = dateFromLine(line, baseDate);
      return parsed ? { ...parsed, line, index } : null;
    })
    .filter(Boolean);
}

function parseClockRanges(text = "", context = "") {
  const value = normalizeNoticeText(text);
  const pattern =
    /(上午|早上|中午|下午|晚上|傍晚|凌晨)?\s*(\d{1,2})(?:(?::|点|时)(\d{1,2}|半)?分?)?\s*(?:到|至|-)\s*(上午|早上|中午|下午|晚上|傍晚|凌晨)?\s*(\d{1,2})(?:(?::|点|时)(\d{1,2}|半)?分?)?/g;
  const ranges = [];
  let match;
  while ((match = pattern.exec(value))) {
    ranges.push({
      raw: match[0],
      start: normalizeClock(match[2], match[3], match[1], context),
      end: normalizeClock(match[5], match[6], match[4] || match[1], context),
      index: match.index,
    });
  }
  return ranges;
}

function parseClockTimes(text = "", context = "") {
  const ranges = parseClockRanges(text, context);
  const covered = ranges.map((range) => [range.index, range.index + range.raw.length]);
  const pattern = /(上午|早上|中午|下午|晚上|傍晚|凌晨)?\s*(\d{1,2})(?:(?::|点|时)(\d{1,2}|半)?分?)/g;
  const times = [];
  let match;
  while ((match = pattern.exec(normalizeNoticeText(text)))) {
    const position = match.index;
    if (covered.some(([start, end]) => position >= start && position < end)) continue;
    times.push({
      raw: match[0],
      time: normalizeClock(match[2], match[3], match[1], context),
      index: position,
    });
  }
  return times;
}

function normalizeClock(hour, minute, marker = "", context = "") {
  let value = Number(hour);
  let mins = minute === "半" ? 30 : Number(minute || 0);
  if (!Number.isFinite(value) || !Number.isFinite(mins) || value > 23 || mins > 59) return "";
  const pmContext = /下午|晚上|傍晚|中午|考试|集合|训练|彩排|考勤|用餐|晚饭|活动/.test(
    `${marker} ${context}`
  );
  const morningContext = /上午|早上|凌晨|升旗|晨间/.test(`${marker} ${context}`);
  if (!morningContext && value > 0 && value < 8 && pmContext) value += 12;
  if (/下午|晚上|傍晚|中午/.test(marker) && value > 0 && value < 12) value += 12;
  return `${pad(value)}:${pad(mins)}`;
}

function timeToMinutes(time = "") {
  const match = /^(\d{2}):(\d{2})$/.exec(time);
  return match ? Number(match[1]) * 60 + Number(match[2]) : Number.NaN;
}

function addMinutes(time, amount) {
  const minutes = timeToMinutes(time);
  if (!Number.isFinite(minutes)) return "";
  const total = (minutes + amount + 1440) % 1440;
  return `${pad(Math.floor(total / 60))}:${pad(total % 60)}`;
}

function extractDeadline(text, baseDate) {
  const lines = normalizeNoticeText(text).split("\n");
  for (const line of lines) {
    if (!/(ddl|deadline|截止|前)/i.test(line)) continue;
    const date = dateFromLine(line, baseDate);
    const range = parseClockRanges(line, line)[0];
    const times = parseClockTimes(line, line);
    const time = range?.start || times.at(-1)?.time || "";
    if (date || time) {
      return {
        date: date?.date || "",
        time,
        source: line.trim(),
      };
    }
  }
  return { date: "", time: "", source: "" };
}

function classifyNotice(text) {
  const value = normalizeNoticeText(text);
  if (/会议号|入会链接|线上会议|钉钉会议|腾讯会议/.test(value)) return "meeting";
  if (/绿色通道|补办/.test(value)) return "service";
  if (/国旗下讲话|升旗仪式|演讲人员|宣讲人员/.test(value)) return "speech";
  if (/高中档案|档案袋|归档材料/.test(value)) return "archive";
  if (/学生登记表|交过来|交给|材料提交/.test(value)) return "submission";
  if (
    parseClockRanges(value, value).length >= 2 &&
    /游园会|宣讲会|多阶段|两场|两个阶段/.test(value)
  ) {
    return "multi_activity";
  }
  if (/视频大赛|作品大赛|参赛作品/.test(value)) return "competition";
  if (/问卷调查|问卷/.test(value)) return "survey";
  if (/考试/.test(value)) return "exam";
  if (/集合|集中|考勤|组织训练/.test(value)) return "assembly";
  return "generic";
}

function inferGenericTitle(text) {
  const value = normalizeNoticeText(text);
  if (/人像采集|图像采集|照片采集/.test(value)) return "参加新生人像采集";
  if (/体检/.test(value)) return "参加新生体检";
  const eventMatch = /的([\u4e00-\u9fa5]{2,16}(?:教育活动|活动|会议|讲座|宣讲会))/u.exec(value);
  if (eventMatch) return `参加${eventMatch[1]}`;
  const action =
    /(完成|填写|提交|参加|整理|办理|报名参加|负责|组织)\s*([^。；;\n]{2,28})/u.exec(
      cleanTitleText(value)
    );
  if (action) return `${action[1]}${action[2]}`.slice(0, 48);
  const candidates = value
    .split("\n")
    .map(cleanTitleText)
    .filter(
      (line) =>
        line &&
        !/^(时间|地点|注意|要求|具体时间|此次|请|为|如有)/.test(line) &&
        !/^\d{1,2}:\d{2}/.test(line)
    );
  return (candidates[0] || "新的待办任务").slice(0, 48);
}

function detectTaskPriority(text) {
  const value = normalizeNoticeText(text);
  if (/ddl|deadline|截止|逾期不再|务必|必须|学籍|时间紧迫|每名新生|全体|教官要求|打分机制/i.test(value)) {
    return "high";
  }
  if (/要求|请|需要|限时|集合|考试|提前.*分钟/.test(value)) return "medium";
  return "low";
}

function taskStep(text, options = {}) {
  return {

    endDate: options.endDate || "",
    endTime: options.endTime || "",
    location: options.location || "",
    role: options.role || "",
    notes: options.notes || "",
  };
}

    location: schedules.map((item) => item.location).join(" / "),
    destination: "",
    meetingUrl: "",
    meetingNumber: "",
    displayNameFormat: "",
    platform: "",
    contacts: [],
    audience: ["还需办理绿色通道的学生"],
    checklist: [
      ...schedules.map((item, index) =>
        taskStep(`场次${index + 1}：${item.start}-${item.end}，${item.location}`, {
          date: date?.date || "",
          time: item.start,
          endTime: item.end,
          location: item.location,

    notes: "逾期不再补办。两个场次任选其一。",
    details: schedules.length
      ? schedules.map((item) => `识别到场次 ${item.start}-${item.end}，地点 ${item.location}`)
      : [],
    warnings: [
      date ? "" : "没有识别到明确日期，请确认。",
      date?.conflict || "",
      schedules.length ? "" : "没有识别到可办理场次。",
    ].filter(Boolean),
  };
}

function examParser(text, baseDate) {
  const value = normalizeNoticeText(text);
  const dates = findDates(value, baseDate);
  const date = dates[0] || null;
  const examLine = value.split("\n").find((line) => /考试.*开始|考试时间/.test(line)) || value;
  const examRange = parseClockRanges(examLine, value)[0];
  const examTime = examRange?.start || parseClockTimes(examLine, value)[0]?.time || "";
  const earlyMinutes = Number(/提前\s*(\d+)\s*分钟/.exec(value)?.[1] || 0);
  const entryTime = examTime && earlyMinutes ? addMinutes(examTime, -earlyMinutes) : "";
  const meetLine = value.split("\n").find((line) => /集合|集中/.test(line)) || "";
  const meetRange = parseClockRanges(meetLine, value)[0];
  const meetTime = meetRange?.start || parseClockTimes(meetLine, value)[0]?.time || "";
  const meetLocation = /在([^，,。；;\n]{2,18})(?:集合|集中)/u.exec(value)?.[1]?.trim() || "";
  const destination = /前往([^，,。；;\n]{2,18})/u.exec(value)?.[1]?.trim() || "";
  const subject = /([\u4e00-\u9fa5A-Za-z]{2,10})考试/u.exec(value)?.[1] || "统一";
  return {
    title: `参加${subject}考试`,
    taskType: "考试",
    priority: "high",
    startDate: date?.date || "",
    startTime: examTime,
    endDate: date?.date || "",
    endTime: examRange?.end || "",
    deadlineDate: date?.date || "",
    deadlineTime: meetTime || entryTime || examTime,
    location: meetLocation,
    destination,
    meetingUrl: "",
    meetingNumber: "",
    displayNameFormat: "",
    platform: "",
    contacts: [...value.matchAll(/(?:由|和|及)([\u4e00-\u9fa5]{2,4})/g)].map((item) => item[1]),
    audience: ["全体同学"],
    checklist: [
      taskStep("提前吃完晚饭"),
      meetTime
        ? taskStep(`${meetTime} 到${meetLocation || "集合地点"}集合`, {
            date: date?.date || "",
            time: meetTime,
            location: meetLocation,
          })
        : null,
      destination ? taskStep(`跟随带队人员前往${destination}`, { location: destination }) : null,
      taskStep("预留考场踩点时间"),
      entryTime
        ? taskStep(`${entryTime} 前进入考场`, {
            date: date?.date || "",
            time: entryTime,
            location: destination,
          })
        : null,
    ].filter(Boolean),
    notes: earlyMinutes ? `考试时间 ${examTime}，需提前 ${earlyMinutes} 分钟进入考场。` : "",
    details: [
      examTime ? `识别到考试时间 ${examTime}` : "",
      entryTime ? `按提前 ${earlyMinutes} 分钟计算，入场时间 ${entryTime}` : "",
      meetTime ? `识别到集合时间 ${meetTime}` : "",
    ].filter(Boolean),
    warnings: date ? [] : ["没有写明日期，已按消息时间默认，请确认。"],
  };
}

function assemblyParser(text, baseDate) {
  const value = normalizeNoticeText(text);
  const dates = findDates(value, baseDate);
  const date = dates[0] || null;
  const ranges = parseClockRanges(value, value);
  const times = parseClockTimes(value, value);
  const fullAssembly = ranges[0]?.start || times[0]?.time || "";
  const bareMinute = /(\d{1,2})\s*分(?:在|集合|集合完毕)/u.exec(value)?.[1];
  let rollCall = ranges[0]?.start || "";
  if (bareMinute && fullAssembly) {
    const assemblyMinutes = timeToMinutes(fullAssembly);
    let candidate = Math.floor(assemblyMinutes / 60) * 60 + Number(bareMinute);
    if (candidate > assemblyMinutes) candidate -= 60;
    rollCall = `${pad(Math.floor((candidate + 1440) % 1440 / 60))}:${pad((candidate + 1440) % 60)}`;
  }
  const location =
    /在([^，,。；;\n]{2,18}?)(?:集合|集中|考勤)/u.exec(value)?.[1]?.trim() ||
    /操场/.exec(value)?.[0] ||
    "";
  const isTraining = /组织训练|训练/.test(value);
  const title = isTraining
    ? `参加${fullAssembly ? `${fullAssembly} ` : ""}训练`
    : /考勤/.test(value)
      ? "参加操场集合考勤"
      : "参加集合";
  const contacts = [...value.matchAll(/(?:给|和|向)([\u4e00-\u9fa5]{2,4})/g)].map((item) => item[1]);
  return {
    title,
    taskType: "集合考勤",
    priority: /教官|必须|要求|考勤/.test(value) ? "high" : "medium",
    startDate: date?.date || "",
    startTime: rollCall || fullAssembly,
    endDate: date?.date || "",
    endTime: fullAssembly,
    deadlineDate: date?.date || "",
    deadlineTime: rollCall || fullAssembly,
    location,
    destination: "",
    meetingUrl: "",
    meetingNumber: "",
    displayNameFormat: "",
    platform: "",
    contacts,
    audience: ["全体同学"],
    checklist: [
      rollCall
        ? taskStep(`${rollCall} 到${location || "集合地点"}考勤`, {
            date: date?.date || "",
            time: rollCall,
            location,
          })
        : null,
      fullAssembly
        ? taskStep(`${fullAssembly} 前集合完毕`, {
            date: date?.date || "",
            time: fullAssembly,
          })
        : null,
      /宿舍长|舍长/.test(value)
        ? taskStep("统计本宿舍舍员出勤情况", { role: "宿舍长" })
        : null,
      /宿舍长|舍长/.test(value)
        ? taskStep(`报告出勤情况给${contacts.join("和") || "通知发布者"}`, { role: "宿舍长" })
        : null,
    ].filter(Boolean),
    notes: isTraining ? "按通知准时参加训练。" : "按时完成考勤并保持集合秩序。",
    details: [
      rollCall ? `识别到考勤时间 ${rollCall}` : "",
      fullAssembly ? `识别到集合完毕时间 ${fullAssembly}` : "",
      location ? `识别到集合地点 ${location}` : "",
    ].filter(Boolean),
    warnings: date ? [] : ["没有写明日期，已按消息时间默认，请确认。"],
  };
}

function genericParser(text, baseDate, profile = {}) {
  const value = normalizeNoticeText(text);
  const dates = findDates(value, baseDate);
  const date = dates[0] || null;
  const deadline = extractDeadline(value, baseDate);
  const range = parseClockRanges(value, value)[0];
  const clock = parseClockTimes(value, value)[0];
  const departmentTime = departmentWindow(value, profile.department || "");
  const location =
    parseLocation(value) ||
    /地点\s*:\s*([^\n]+)/u.exec(value)?.[1]?.trim() ||
    /在([^，,。；;\n]{2,18})(?:集合|集中|举办|进行)/u.exec(value)?.[1]?.trim() ||
    "";
  const checklist = value
    .split("\n")
    .map((line) => line.replace(/^\s*(?:\d+[.、]|[一二三四五六七八九十]+[、.])\s*/u, "").trim())
    .filter((line) => /^(完成|准备|提交|参加|携带|穿|打印|报名|填写|整理)/.test(line))
    .slice(0, 8)
    .map((line) => taskStep(line));
  return {
    title: inferGenericTitle(value),
    taskType: "一般任务",
    priority: detectTaskPriority(value),
    startDate: date?.date || deadline.date || todayIso(),
    startTime: departmentTime.start || range?.start || clock?.time || "",
    endDate: date?.date || deadline.date || todayIso(),
    endTime: departmentTime.end || range?.end || "",
    deadlineDate: deadline.date || date?.date || "",
    deadlineTime: deadline.time || departmentTime.start || range?.start || "",
    location,
    destination: "",
    meetingUrl: "",
    meetingNumber: "",
    displayNameFormat: "",
    platform: "",
    contacts: [],
    audience: [],
    checklist: checklist.length ? checklist : [taskStep("查看并处理通知内容")],
    notes: "",
    notesItems: extractAttentionNotes(value),
    details: [
      date ? `识别到日期 ${formatFullDate(date.date)}` : "",
      range ? `识别到时间 ${range.start}-${range.end}` : "",
      location ? `识别到地点 ${location}` : "",
    ].filter(Boolean),
    warnings: [
      date || deadline.date ? "" : "没有识别到明确日期，请确认。",
      date?.conflict || "",
    ].filter(Boolean),
  };
}

function multiActivityParser(text, baseDate, profile = {}) {
  const value = normalizeNoticeText(text);
  const dates = findDates(value, baseDate);
  const date = dates[0] || null;
  const lines = value.split("\n");
  const timedLines = lines
    .map((line) => ({ line, range: parseClockRanges(line, line)[0] }))
    .filter((item) => item.range);
  const title = cleanTitleText(
    /【([^】]*(?:宣讲会|游园会|活动)[^】]*)】/u.exec(value)?.[1] ||
      "参加多阶段活动"
  );
  const location = parseLocation(value) || (/活动中心/u.test(value) ? "活动中心" : "");
  const steps = timedLines.slice(0, 4).map((item, index) => {
    const label =
      /游园会/u.test(item.line)
        ? "参加游园会"
        : /宣讲会/u.test(item.line)
          ? "参加宣讲会"
          : `活动阶段 ${index + 1}`;
    return taskStep(label, {
      date: date?.date || "",
      time: item.range.start,
      endDate: date?.date || "",
      endTime: item.range.end,
      location,
    });
  });

  const registrationMatch =
    /(?:已报名入库|报名入库)[^。\n]{0,30}?(?:自行)?前往【?([^】。，,\n]+)】?/u.exec(value) ||
    /前往【?([^】。，,\n]+)】?教室进行入库/u.exec(value);
  const conditions = [];
  if (registrationMatch) {
    const destination = registrationMatch[1].trim();
    const lastEnd = timedLines.at(-1)?.range?.end || "";
    const condition = buildConditionalTask(
      "是否已经报名入库？",
      {
        text: `宣讲会结束后前往${destination}进行入库`,
        date: date?.date || "",
        time: lastEnd,
        location: destination,
      },
      {
        triggerText: "报名入库的同学",
        yesLabel: "是，已报名入库",
        noLabel: "否，没有报名",
      }
    );
    const savedAnswer = profile.conditionAnswers?.[condition.id];
    if (savedAnswer) {
      const selected = condition.options.find((option) => option.value === savedAnswer);
      if (selected?.step) steps.push(taskStep(selected.step.text, selected.step));
    } else {
      conditions.push(condition);
    }
  }

  const firstRange = timedLines[0]?.range;
  const lastRange = timedLines.at(-1)?.range;
  return {
    title: title.startsWith("参加") ? title : `参加${title}`,
    taskType: "多阶段活动",
    priority: /请各班|按时参加|不要.*迟到/.test(value) ? "high" : "medium",
    startDate: date?.date || "",
    startTime: firstRange?.start || "",
    endDate: date?.date || "",
    endTime: lastRange?.end || "",
    location,
    destination: registrationMatch?.[1]?.trim() || "",
    meetingUrl: "",
    meetingNumber: "",
    displayNameFormat: "",
    platform: "",
    contacts: [/联系【([^】]+)】/u.exec(value)?.[1]].filter(Boolean),
    audience: /大一新生/u.test(value) ? ["大一新生"] : [],
    checklist: steps,
    notes: "该通知包含多个连续活动，请按时间顺序参加。",
    notesItems: extractAttentionNotes(value),
    conditions,
    details: [
      date ? `识别到活动日期 ${formatFullDate(date.date)}` : "",
      timedLines.length ? `识别到 ${timedLines.length} 个活动阶段` : "",
      location ? `识别到地点 ${location}` : "",
      registrationMatch ? `识别到条件任务：是否已报名入库` : "",
    ].filter(Boolean),
    warnings: [
      date ? "" : "没有识别到明确日期。",
      timedLines.length >= 2 ? "" : "没有识别到多个活动阶段。",
    ].filter(Boolean),
  };
}

function parseNotice(text, profile = state?.settings || {}, forcedType = "") {
  const sourceText = String(text || "").trim();
  const normalized = normalizeNoticeText(sourceText);
  const baseDate = messageTimestamp(sourceText) || new Date();
  const autoType = classifyNotice(normalized);
  const parsers = {
    meeting: meetingParser,
    submission: submissionParser,
    speech: speechParser,
    archive: archiveParser,
    competition: competitionParser,
    survey: surveyParser,
    service: serviceParser,
    exam: examParser,
    assembly: assemblyParser,
    multi_activity: multiActivityParser,
    generic: genericParser,
  };
  const type = forcedType && parsers[forcedType] ? forcedType : autoType;
  const parsed = parsers[type](normalized, baseDate, profile);
  const now = new Date().toISOString();
  const task = normalizeTask({
    id: uid("task"),
    ...parsed,
    notesItems: parsed.notesItems || extractAttentionNotes(sourceText),
    sourceText,
    sourceName: "群通知",
    status: "open",
    createdAt: now,
    updatedAt: now,
    completedAt: "",
    messageTimestamp: baseDate.toISOString(),
  });
  const confidence = Math.max(
    0.45,
    Math.min(
      0.98,
      0.5 +
        (task.startDate || task.endDate ? 0.18 : 0) +
        (task.startTime || task.endTime ? 0.14 : 0) +
        (task.location ? 0.09 : 0) +
        (task.checklist.length >= 2 ? 0.07 : 0)
    )
  );
  return {
    task,
    confidence,
    details: parsed.details || [],
    warnings: parsed.warnings || [],
    dateSource: task.startDate ? formatFullDate(task.startDate) : "",
    timeSource: task.startTime || task.endTime || "",
    noticeType: type,
  };
}

function normalizeTask(task = {}) {
  const startDate = String(task.startDate || task.date || todayIso());
  const startTime = String(task.startTime || task.arriveTime || "");
  const endDate = String(task.endDate || startDate);
  const endTime = String(task.endTime || "");
  return {
    id: task.id || uid("task"),
    title: String(task.title || "未命名任务"),
    taskType: String(task.taskType || "一般任务"),
    priority: PRIORITY_META[task.priority] ? task.priority : "medium",
    startDate,
    startTime,
    endDate: String(task.endDate || task.deadlineDate || startDate),
    endTime: String(task.endTime || task.deadlineTime || ""),
    location: String(task.location || ""),
    destination: String(task.destination || ""),
    meetingUrl: String(task.meetingUrl || ""),
    meetingNumber: String(task.meetingNumber || ""),
    displayNameFormat: String(task.displayNameFormat || ""),
    platform: String(task.platform || ""),
    contacts: Array.isArray(task.contacts) ? task.contacts.map(String).filter(Boolean) : [],
    audience: Array.isArray(task.audience) ? task.audience.map(String).filter(Boolean) : [],
    notesItems: Array.isArray(task.notesItems)
      ? task.notesItems.map((item) => ({
          category: String(item.category || "注意事项"),
          text: String(item.text || ""),
        }))
      : [],
    conditions: Array.isArray(task.conditions) ? task.conditions : [],
    checklist: Array.isArray(task.checklist)
      ? task.checklist.map((item) => ({
          id: item.id || uid("check"),
          text: String(item.text || ""),
          done: Boolean(item.done),
          date: String(item.date || ""),
          time: String(item.time || ""),
          endDate: String(item.endDate || ""),
          endTime: String(item.endTime || ""),
          location: String(item.location || ""),
          role: String(item.role || ""),
          notes: String(item.notes || ""),
        }))
      : [],
    notes: String(task.notes || ""),
    sourceText: String(task.sourceText || ""),
    sourceName: String(task.sourceName || "手动添加"),
    status: task.status === "done" ? "done" : "open",
    createdAt: task.createdAt || new Date().toISOString(),
    updatedAt: task.updatedAt || task.createdAt || new Date().toISOString(),
    completedAt: String(task.completedAt || ""),
    messageTimestamp: String(task.messageTimestamp || ""),
  };
}

function normalizeState(parsed, fallback) {
  const source = parsed && typeof parsed === "object" ? parsed : {};
  const settings = source.settings && typeof source.settings === "object" ? source.settings : {};
  return {
    version: 4,
    tasks: Array.isArray(source.tasks) ? source.tasks.map(normalizeTask) : fallback.tasks,
    settings: {
      name: String(settings.name || fallback.settings.name || ""),
      studentId: String(settings.studentId || fallback.settings.studentId || ""),
      className: String(settings.className || fallback.settings.className || ""),
      department: String(settings.department || fallback.settings.department || ""),
      role: String(settings.role || fallback.settings.role || "普通学生"),
      gender: ["男", "女", "其他"].includes(settings.gender) ? settings.gender : "",
      conditionAnswers:
        settings.conditionAnswers && typeof settings.conditionAnswers === "object"
          ? settings.conditionAnswers
          : {},
      advanceMinutes: Number.isFinite(Number(settings.advanceMinutes))
        ? Number(settings.advanceMinutes)
        : fallback.settings.advanceMinutes,

}

function loadState() {
  const fallback = createInitialState();

    return normalizeState(JSON.parse(raw), fallback);
  } catch (error) {
    console.warn("无法读取本地任务", error);
    return fallback;

}

function saveState() {
  state.settings.lastFilter = activeFilter;
  state.settings.sortMode = sortMode;
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));

function taskPriorityRank(task) {
  return PRIORITY_META[task.priority]?.order ?? 1;
}

function taskSortTimestamp(task) {
  const timestamp = taskDateTime(task)?.getTime();
  return Number.isFinite(timestamp) ? timestamp : Number.MAX_SAFE_INTEGER;
}

function getOpenTasks() {
  return state.tasks.filter((task) => task.status !== "done");
}

function getCompletedTasks() {
  return state.tasks
    .filter((task) => task.status === "done")
    .sort((a, b) => new Date(b.completedAt || b.updatedAt) - new Date(a.completedAt || a.updatedAt));
}

function sortedOpenTasks() {
  const now = Date.now();
  return [...getOpenTasks()].sort((a, b) => {
    const aTime = taskSortTimestamp(a);
    const bTime = taskSortTimestamp(b);
    const aOverdue = aTime < now;
    const bOverdue = bTime < now;

    if (aOverdue !== bOverdue) return aOverdue ? -1 : 1;
    if (sortMode === "priority") {
      return taskPriorityRank(a) - taskPriorityRank(b) || aTime - bTime;
    }
    if (sortMode === "time") {
      return aTime - bTime || taskPriorityRank(a) - taskPriorityRank(b);
    }

    const aScore = aTime - (a.priority === "high" ? 90 * 60000 : a.priority === "medium" ? 20 * 60000 : 0);
    const bScore = bTime - (b.priority === "high" ? 90 * 60000 : b.priority === "medium" ? 20 * 60000 : 0);
    return aScore - bScore || taskPriorityRank(a) - taskPriorityRank(b);
  });
}

function filterTasks() {
  if (activeFilter === "completed") return getCompletedTasks();
  const tasks = sortedOpenTasks();
  if (activeFilter === "today") {
    const now = new Date();
    const endOfToday = new Date();
    endOfToday.setHours(23, 59, 59, 999);
    return tasks.filter((task) => {
      const due = taskDateTime(task);
      return (due && due <= endOfToday) || (!due && task.startDate <= todayIso());
    });
  }
  return tasks;
}

function syncCounts() {
  const endOfToday = new Date();
  endOfToday.setHours(23, 59, 59, 999);
  const today = getOpenTasks().filter((task) => {
    const due = taskDateTime(task);
    return due ? due <= endOfToday : task.startDate <= todayIso();
  }).length;
  const upcoming = getOpenTasks().length;
  const completed = getCompletedTasks().length;
  todayCountElement.textContent = String(today);
  upcomingCountElement.textContent = String(upcoming);
  completedCountElement.textContent = String(completed);
  todayCountElement.hidden = today === 0;
  upcomingCountElement.hidden = upcoming === 0;
  completedCountElement.hidden = completed === 0;
}

        }

      ${renderTaskList(tasks)}
    </section>
  `;

  document.querySelectorAll("[data-filter]").forEach((button) => {
    button.classList.toggle("is-active", button.dataset.filter === activeFilter);
  });

  refreshIcons();
  syncCounts();
}

function renderNextTask(task) {
  const countdown = formatCountdown(task);
  const minutes = minutesUntil(task);
  const nextStep = getNextStep(task);
  const progress = taskProgress(task);
  const urgencyClass =
    task.taskType === "线上会议" && countdown === "已结束"
      ? ""
      : minutes < 0
        ? "is-urgent"
        : minutes <= 120
          ? "is-soon"
          : "";
  return `
    <section class="next-section">
      <article class="next-card ${urgencyClass}" id="nextTaskCard">
        <div class="next-card-top">
          <span class="next-label">${icon("zap")} 下一件</span>
          <span class="countdown-badge ${minutes >= 0 && minutes <= 30 ? "is-pulsing" : ""}">${escapeHtml(countdown)}</span>
        </div>
        <h2 class="next-title">${escapeHtml(task.title)}</h2>
        <div class="next-meta">
          <span class="meta-chip">${icon("calendar-clock")} ${escapeHtml(taskTimeLabel(task))}</span>
          ${
            task.location
              ? `<span class="meta-chip">${icon("map-pin")} ${escapeHtml(task.location)}</span>`
              : ""
          }
          <span class="meta-chip">${icon("flag")} ${PRIORITY_META[task.priority].label}优先级</span>
          ${
            progress.total
              ? `<span class="meta-chip">${icon("list-checks")} ${progress.done}/${progress.total} 步</span>`
              : ""
          }
        </div>
        ${
          nextStep
            ? `<p class="next-note">下一步：${escapeHtml(nextStep.text)}</p>`
            : task.notes
              ? `<p class="next-note">${escapeHtml(task.notes)}</p>`
            : ""
        }
        <div class="next-actions">
          <button class="complete-next-button" type="button" data-action="complete-task" data-id="${task.id}">
            ${icon("check")} 完成任务
          </button>
          <button class="open-next-button" type="button" data-action="open-task-progress" data-id="${task.id}" aria-label="查看任务详情">
            ${icon("arrow-up-right")}
          </button>
        </div>
      </article>
    </section>
  `;
}

function renderTaskList(tasks) {
  if (!tasks.length) {
    const content =
      activeFilter === "completed"
        ? {
            icon: "circle-check-big",
            title: "还没有完成记录",
            text: "勾选任务后，它会带着完成动效移动到这里。",
          }
        : activeFilter === "today"
          ? {
              icon: "sun-medium",
              title: "今天没有待办",
              text: "可以查看全部任务，或者粘贴一条新的群通知。",
            }
          : {
              icon: "clipboard-list",
              title: "还没有任务",
              text: "把群里的通知粘贴进来，软件会先提取信息再让你确认。",
            };
    return `
      <div class="empty-state">
        <div>
          <span class="empty-icon">${icon(content.icon)}</span>
          <h2>${content.title}</h2>
          <p>${content.text}</p>
          ${
            activeFilter !== "completed"
              ? `<button class="secondary-button" type="button" data-action="open-paste">${icon("clipboard-paste")} 粘贴群通知</button>`
              : ""
          }
        </div>
      </div>
    `;
  }
  return `<div class="task-list">${tasks.map(renderTaskItem).join("")}</div>`;
}

function taskTimeLabel(task) {
  const due = taskDateTime(task) || parseIsoDate(task.endDate || task.startDate);
  const date = due ? formatDate(toIsoDate(due)) : "日期待定";
  const nextStep = getNextStep(task);
  const time =
    nextStep?.time ||
    nextStep?.endTime ||
    task.endTime ||
    task.startTime ||
    "";
  const timeLabel = time
    ? task.taskType === "线上会议" && task.endTime
      ? `${time}-${task.endTime}`
      : time
    : "时间待定";
  return `${date} ${timeLabel}`;
}

function renderTaskItem(task) {
  const completed = task.status === "done";
  const taskDue = taskDateTime(task);
  const overdue =
    !completed &&
    taskDue &&
    taskDue < new Date() &&
    !(task.taskType === "线上会议" && taskEndDateTime(task) < new Date());
  const soon = !completed && !overdue && minutesUntil(task) <= 120;
  const progress = taskProgress(task);
  const nextStep = getNextStep(task);
  return `
    <article class="task-item ${completed ? "is-completed" : ""} ${overdue ? "is-overdue" : ""} ${soon ? "is-soon" : ""}" data-task-id="${task.id}">
      <button class="task-check" type="button" data-action="${completed ? "restore-task" : "complete-task"}" data-id="${task.id}" aria-label="${completed ? "恢复任务" : "完成任务"}">
        ${icon("check")}
      </button>
      <div class="task-main" data-action="open-task-progress" data-id="${task.id}">
        <div class="task-title-row">
          <p class="task-title">${escapeHtml(task.title)}</p>
          <span class="priority-pill ${task.priority}">${PRIORITY_META[task.priority].label}</span>
        </div>
        <div class="task-meta">
          <span>${icon("tag")} ${escapeHtml(task.taskType)}</span>
          <span class="${overdue ? "overdue-text" : ""}">${icon("calendar-clock")} ${escapeHtml(taskTimeLabel(task))}</span>
          ${task.location ? `<span>${icon("map-pin")} ${escapeHtml(task.location)}</span>` : ""}
          ${progress.total ? `<span>${icon("list-checks")} ${progress.done}/${progress.total}</span>` : ""}
        </div>
        ${
          nextStep
            ? `<p class="task-note-preview">下一步：${escapeHtml(nextStep.text)}</p>`
            : task.notes
              ? `<p class="task-note-preview">${escapeHtml(task.notes)}</p>`
            : ""
        }
      </div>
      <div class="task-actions">
        ${
          completed
            ? `<button class="task-undo-button" type="button" data-action="restore-task" data-id="${task.id}">${icon("rotate-ccw")} 撤销</button>`
            : `<button class="mini-icon-button" type="button" data-action="open-task-progress" data-id="${task.id}" aria-label="查看任务步骤" title="查看步骤">${icon("chevron-right")}</button>`
        }
        <button class="mini-icon-button danger" type="button" data-action="delete-task" data-id="${task.id}" aria-label="删除任务">
          ${icon("trash-2")}
        </button>
      </div>
    </article>
  `;
}

function submitConditions() {
  if (!pendingConditionalParsed) return;
  const conditions = pendingConditionalParsed.task.conditions || [];
  const resolvedSteps = [];
  const answers = {};

  for (let index = 0; index < conditions.length; index += 1) {
    const condition = conditions[index];
    const selected = document.querySelector(
      `input[name="condition-answer-${index}"]:checked`
    );
    if (!selected) {
      document.querySelector(`[data-condition-index="${index}"]`)?.scrollIntoView({
        behavior: "smooth",
        block: "center",
      });
      showToast(`请先回答：${condition.question}`, "error");
      return;
    }
    const option = condition.options.find((item) => item.value === selected.value);
    answers[condition.id] = selected.value;
    if (option?.step) {
      resolvedSteps.push(taskStep(option.step.text, option.step));
    }
  }

  pendingConditionalParsed.task.checklist.push(...resolvedSteps);
  pendingConditionalParsed.task.conditions = [];
  pendingConditionalParsed.task.conditionAnswers = {
    ...(pendingConditionalParsed.task.conditionAnswers || {}),
    ...answers,
  };
  state.settings.conditionAnswers = {
    ...(state.settings.conditionAnswers || {}),
    ...answers,
  };
  saveState();
  pendingParsedTask = pendingConditionalParsed;
  pendingConditionalParsed = null;
  openParsePreview(pendingParsedTask);
}

                   ? `<div class="detail-info"><strong>会议号</strong><span>${escapeHtml(task.meetingNumber)}</span></div>`
                   : ""

          ? `<details class="source-details">

  `;
}

function renderProgressSteps(task) {
  if (!task.checklist.length) {
    return `<div class="empty-state compact" style="min-height:150px">
      <div>
        <span class="empty-icon">${icon("list-plus")}</span>
        <h2>还没有小任务</h2>
        <p>进入编辑界面添加执行步骤。</p>
      </div>
    </div>`;
  }
  return `
    <div class="progress-step-list">
      ${task.checklist
        .map(
          (step, index) => `
            <article class="progress-step-card ${step.done ? "is-done" : ""}">
              <div class="progress-step">
                <button class="progress-step-check" type="button" data-action="toggle-step" data-id="${task.id}" data-step-id="${step.id}" aria-label="${step.done ? "取消完成" : "完成子任务"}">
                  ${icon("check")}
                </button>
                <button class="progress-step-copy" type="button" data-action="toggle-step-details" data-id="${task.id}" data-step-id="${step.id}">
                  <strong>${index + 1}. ${escapeHtml(step.text)}</strong>
                  <small>
                    ${step.date ? `${escapeHtml(formatDate(step.date))}${step.time ? ` ${escapeHtml(step.time)}` : ""}` : "时间待定"}
                    ${step.location ? ` · ${escapeHtml(step.location)}` : ""}
                  </small>
                </button>
                <button class="progress-step-expand" type="button" data-action="toggle-step-details" data-id="${task.id}" data-step-id="${step.id}" aria-label="展开编辑">
                  ${icon(expandedStepId === step.id ? "chevron-up" : "chevron-down")}
                </button>
              </div>
              ${
                expandedStepId === step.id
                  ? `<div class="step-detail-editor">
                       <div class="step-detail-grid">
                         <div class="field">
                           <span class="field-label">开始时间</span>
                           <div class="datetime-combo compact">
                             <input aria-label="子任务开始日期" data-step-edit-start-date type="date" value="${escapeHtml(step.date || "")}" />
                             <input aria-label="子任务开始时刻" data-time-input data-step-edit-start-time type="text" inputmode="numeric" maxlength="5" value="${escapeHtml(step.time || "")}" placeholder="18:30" />
                           </div>

                         <div class="field">
                           <span class="field-label">结束时间 / DDL</span>
                           <div class="datetime-combo compact">

                             <input aria-label="子任务结束时刻" data-time-input data-step-edit-end-time type="text" inputmode="numeric" maxlength="5" value="${escapeHtml(step.endTime || "")}" placeholder="18:30" />

                       </div>

                  : ""

          `
        )
        .join("")}

  `;

function renderStructuredNotes(task) {
  if (!task.notesItems?.length) return "";
  const groups = task.notesItems.reduce((result, item) => {
    const category = item.category || "注意事项";
    if (!result[category]) result[category] = [];
    result[category].push(item.text);
    return result;
  }, {});
  return `
    <div class="attention-grid">
      ${Object.entries(groups)
        .map(
          ([category, notes]) => `
            <section class="attention-card">
              <h4>${escapeHtml(category)}</h4>
              <ul>
                ${notes.map((note) => `<li>${escapeHtml(note)}</li>`).join("")}
              </ul>
            </section>
          `
        )
        .join("")}
    </div>
  `;
}
