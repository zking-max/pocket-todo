function saveParsedTask() {
  if (!pendingParsedTask) return;
  const form = document.querySelector("#parsedTaskForm");
  if (!form?.reportValidity()) return;
  const task = pendingParsedTask.task;
  const checklist = [...form.querySelectorAll("[data-parsed-step]")]
    .filter((element) => element.querySelector("[data-requirement-index]")?.checked)
    .map((element) => ({
      id: uid("check"),
      text: element.querySelector("[data-step-title]")?.value.trim() || "未命名步骤",
      done: false,
      date: element.querySelector("[data-step-date]")?.value || "",
      time: element.querySelector("[data-step-time]")?.value || "",
      endDate: "",
      endTime: "",
      location: element.querySelector("[data-step-location]")?.value.trim() || "",
      role: "",
    }))
    .filter((step) => step.text);
  const newTask = normalizeTask({
    ...task,
    id: uid("task"),
    title: form.querySelector("#parsedTitle")?.value.trim() || task.title,
    taskType: form.querySelector("#parsedTaskType")?.value.trim() || task.taskType,
    startDate: form.querySelector("#parsedStartDate")?.value || task.startDate,
    startTime: normalizeTimeValue(form.querySelector("#parsedStartTime")?.value || ""),
    endDate: form.querySelector("#parsedEndDate")?.value || task.endDate,
    endTime: normalizeTimeValue(form.querySelector("#parsedEndTime")?.value || ""),
    location: form.querySelector("#parsedLocation")?.value.trim() || "",
    destination: form.querySelector("#parsedDestination")?.value.trim() || "",
    priority: form.querySelector('input[name="parsedPriority"]:checked')?.value || task.priority,
    checklist,
    notes: form.querySelector("#parsedNotes")?.value.trim() || "",
    createdAt: new Date().toISOString(),
    updatedAt: new Date().toISOString(),
  });
  state.tasks.unshift(newTask);
  const referenceDate = newTask.endDate || newTask.startDate;
  activeFilter = referenceDate && referenceDate <= todayIso() ? "today" : "upcoming";
  saveState();
  closeSheet();
  render();
  showToast("任务已加入时间轴");
}

function saveEditedTask(taskId) {
  const task = state.tasks.find((item) => item.id === taskId);
  const form = document.querySelector(".sheet-content");
  const titleInput = form?.querySelector("#editTitle");
  if (!task || !titleInput?.reportValidity()) return;
  task.title = titleInput.value.trim() || task.title;
  task.taskType = form.querySelector("#editTaskType")?.value.trim() || task.taskType;
  task.startDate = form.querySelector("#editStartDate")?.value || task.startDate;
  task.startTime = normalizeTimeValue(form.querySelector("#editStartTime")?.value || "");
  task.endDate = form.querySelector("#editEndDate")?.value || task.endDate;
  task.endTime = normalizeTimeValue(form.querySelector("#editEndTime")?.value || "");
  task.location = form.querySelector("#editLocation")?.value.trim() || "";
  task.destination = form.querySelector("#editDestination")?.value.trim() || "";
  task.priority = form.querySelector('input[name="editPriority"]:checked')?.value || task.priority;
  task.notes = form.querySelector("#editNotes")?.value.trim() || "";
  task.checklist = [...form.querySelectorAll("[data-edit-step]")].map((element, index) => ({
    ...(task.checklist[index] || {}),
    id: task.checklist[index]?.id || uid("check"),
    text: element.querySelector("[data-edit-step-title]")?.value.trim() || task.checklist[index]?.text || "未命名步骤",
    done: Boolean(element.querySelector("[data-edit-check-index]")?.checked),
    date: element.querySelector("[data-edit-step-date]")?.value || "",
    time: normalizeTimeValue(element.querySelector("[data-edit-step-time]")?.value || ""),
    endDate: task.checklist[index]?.endDate || "",
    endTime: task.checklist[index]?.endTime || "",
    location: element.querySelector("[data-edit-step-location]")?.value.trim() || "",
    role: task.checklist[index]?.role || "",
  }));
  task.updatedAt = new Date().toISOString();
  saveState();
  closeSheet();
  render();
  showToast("任务已更新");
}

function completeTask(taskId) {
  const task = state.tasks.find((item) => item.id === taskId);
  if (!task || task.status === "done") return;
  const taskElement = document.querySelector(`[data-task-id="${taskId}"]`);
  taskElement?.classList.add("is-completing");
  document.querySelector("#nextTaskCard")?.classList.add("is-completing");
  navigator.vibrate?.(18);

  window.setTimeout(() => {
    task.status = "done";
    task.completedAt = new Date().toISOString();
    task.updatedAt = task.completedAt;
    lastCompletedTaskId = task.id;
    const keepProgressSheet = Boolean(document.querySelector(".task-progress-view"));
    saveState();
    render();
    if (keepProgressSheet) openTaskProgressSheet(task.id);
    showToast("已完成 · 撤销", {
      actionLabel: "撤销",
      action: () => restoreTask(task.id),
      duration: 5000,
    });
  }, window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 30 : 720);
}

function toggleTaskStep(taskId, stepId) {
  const task = state.tasks.find((item) => item.id === taskId);
  const step = task?.checklist.find((item) => item.id === stepId);
  if (!task || !step) return;
  step.done = !step.done;
  const progress = taskProgress(task);
  task.updatedAt = new Date().toISOString();
  navigator.vibrate?.(12);
  saveState();
  render();
  if (document.querySelector(".task-progress-view")) {
    openTaskProgressSheet(task.id);
  }
  if (progress.total > 0 && progress.done === progress.total) {
    showToast("子任务已全部完成，请单独确认完成大任务");
  }
}

function toggleStepDetails(taskId, stepId) {
  expandedStepId = expandedStepId === stepId ? "" : stepId;
  openTaskProgressSheet(taskId);
}

function saveStepDetails(taskId, stepId) {
  const task = state.tasks.find((item) => item.id === taskId);
  const step = task?.checklist.find((item) => item.id === stepId);
  const content = document.querySelector(".sheet-content");
  if (!task || !step || !content) return;
  step.date = content.querySelector("[data-step-edit-start-date]")?.value || "";
  step.time = normalizeTimeValue(content.querySelector("[data-step-edit-start-time]")?.value || "");
  step.endDate = content.querySelector("[data-step-edit-end-date]")?.value || "";
  step.endTime = normalizeTimeValue(content.querySelector("[data-step-edit-end-time]")?.value || "");
  step.location = content.querySelector("[data-step-edit-location]")?.value.trim() || "";
  step.notes = content.querySelector("[data-step-edit-notes]")?.value.trim() || "";
  task.updatedAt = new Date().toISOString();
  saveState();
  render();
  openTaskProgressSheet(task.id);
  showToast("子任务设置已保存");
}

function restoreTask(taskId) {
  const task = state.tasks.find((item) => item.id === taskId);
  if (!task) return;
  task.status = "open";
  task.completedAt = "";
  task.updatedAt = new Date().toISOString();
  lastCompletedTaskId = "";
  const keepProgressSheet = Boolean(document.querySelector(".task-progress-view"));
  saveState();
  render();
  if (keepProgressSheet) openTaskProgressSheet(task.id);
  showToast("任务已恢复");
}

function deleteTask(taskId) {
  const task = state.tasks.find((item) => item.id === taskId);
  if (!task) return;
  pendingConfirmAction = () => {
    state.tasks = state.tasks.filter((item) => item.id !== taskId);
    saveState();
    closeSheet();
    render();
    showToast("任务已删除");
  };
  openSheet({
    title: "删除任务？",
    subtitle: "删除后无法撤销",
    content: `
      <p style="margin:0;color:var(--ink-soft);line-height:1.7">

      <button class="danger-button" type="button" data-action="confirm-delete">${icon("trash-2")} 确认删除</button>

}

function showToast(message, options = {}) {
  const toast = document.createElement("div");
  toast.className = `toast ${options.tone === "error" ? "error" : ""}`;
  toast.innerHTML = `
    ${icon(options.tone === "error" ? "circle-alert" : "circle-check")}
    <span>${escapeHtml(message)}</span>
    ${options.actionLabel ? `<button type="button" data-toast-action>${escapeHtml(options.actionLabel)}</button>` : ""}
  `;
  toastStack.appendChild(toast);
  refreshIcons();
  const remove = () => {
    toast.style.opacity = "0";
    toast.style.transform = "translateY(6px)";
    window.setTimeout(() => toast.remove(), 180);
  };
  toast.querySelector("[data-toast-action]")?.addEventListener("click", () => {
    options.action?.();
    remove();
  });
  window.setTimeout(remove, options.duration || 2800);
}

function exportData() {
  const payload = {
    app: "到点 · 群消息待办",
    version: 4,
    exportedAt: new Date().toISOString(),
    state,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {
    type: "application/json;charset=utf-8",
  });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = `到点-任务备份-${todayIso()}.json`;
  document.body.appendChild(link);
  link.click();
  link.remove();
  window.setTimeout(() => URL.revokeObjectURL(url), 5000);
  showToast("备份已导出");
}

async function importData(file) {
  if (!file) return;
  try {
    const parsed = JSON.parse(await file.text());
    const imported = parsed.state || parsed;
    if (!Array.isArray(imported.tasks)) throw new Error("备份中没有任务数据");
    state = normalizeState(imported, createInitialState());
    activeFilter = state.settings.lastFilter;
    sortMode = state.settings.sortMode;
    saveState();
    closeSheet();
    render();
    showToast("备份已恢复");
  } catch (error) {
    console.error(error);
    showToast(`导入失败：${error.message || "文件无法读取"}`, "error");
  }
}

function handleAction(actionElement) {
  const action = actionElement.dataset.action;
  const id = actionElement.dataset.id || "";
  const index = Number(actionElement.dataset.index);

  const actions = {
    "open-paste": openPasteSheet,
    "close-sheet": closeSheet,
    "load-example": () => {
      const textarea = document.querySelector("#noticeInput");
      if (textarea) {
        textarea.value = SAMPLE_NOTICE;
        textarea.focus();
      }
    },
    "parse-paste": () => {
      const textarea = document.querySelector("#noticeInput");
      const text = textarea?.value.trim();
      if (!text) {
        textarea?.focus();
        showToast("请先粘贴一条群通知", "error");
        return;
      }
      const parsed = parseNotice(text, state.settings);
      if (parsed.task.conditions?.length) {
        pendingConditionalParsed = parsed;
        openConditionPrompt(parsed);
      } else {
        pendingParsedTask = parsed;
        openParsePreview(parsed);
      }
    },
    "submit-conditions": submitConditions,
    "back-to-paste": openParseSourceAgain,
    "save-parsed-task": saveParsedTask,
    "reparse-template": () => {
      if (!pendingParsedTask) return;
      pendingReparseType = document.querySelector("#parsedTemplateType")?.value || "generic";
      pendingReparseCustomType =
        document.querySelector("#parsedTaskType")?.value.trim() || "";
      openSheet({
        title: "重新解析？",
        subtitle: "当前手动修改的字段会被覆盖",
        content: `<p style="margin:0;color:var(--ink-soft);line-height:1.7">软件将按照所选任务类型重新提取标题、时间、地点和步骤。</p>`,
        footer: `
          <button class="ghost-button" type="button" data-action="cancel-reparse">取消</button>
          <button class="primary-button" type="button" data-action="confirm-reparse">${icon("refresh-cw")} 确认重新解析</button>
        `,
      });
    },
    "cancel-reparse": () => openParsePreview(pendingParsedTask),
    "confirm-reparse": () => {
      if (!pendingParsedTask) return;
      const customType = pendingReparseCustomType;
      const template = pendingReparseType || "generic";
      pendingParsedTask = parseNotice(
        pendingParsedTask.task.sourceText,
        state.settings,
        template === "custom" ? "generic" : template
      );
      if (template === "custom" && customType) {
        pendingParsedTask.task.taskType = customType;
      }
      pendingReparseType = "";
      pendingReparseCustomType = "";
      openParsePreview(pendingParsedTask);
    },
    "remove-requirement": () => {
      if (!pendingParsedTask) return;
      pendingParsedTask.task.checklist.splice(index, 1);
      openParsePreview(pendingParsedTask);
    },
    "add-parsed-step": () => {
      if (!pendingParsedTask) return;
      pendingParsedTask.task.checklist.push(taskStep("新的执行步骤"));
      openParsePreview(pendingParsedTask);
    },
    "open-task": () => openTaskProgressSheet(id),
    "open-task-progress": () => openTaskProgressSheet(id),
    "open-task-edit": () => openTaskEditorSheet(id),
    "save-task": () => saveEditedTask(id),
    "remove-edit-check": () => {
      const task = state.tasks.find((item) => item.id === id);
      if (!task) return;
      task.checklist.splice(index, 1);
      openTaskEditorSheet(task.id);
    },
    "add-edit-step": () => {
      const task = state.tasks.find((item) => item.id === id);
      if (!task) return;
      task.checklist.push(taskStep("新的执行步骤"));
      task.updatedAt = new Date().toISOString();
      openTaskEditorSheet(task.id);
    },
    "complete-task": () => completeTask(id),
    "toggle-step": () => toggleTaskStep(id, actionElement.dataset.stepId || ""),
    "toggle-step-details": () => toggleStepDetails(id, actionElement.dataset.stepId || ""),
    "save-step-details": () => saveStepDetails(id, actionElement.dataset.stepId || ""),
    "restore-task": () => restoreTask(id),
    "delete-task": () => deleteTask(id),
    "confirm-delete": () => pendingConfirmAction?.(),
    "open-settings": openSettingsSheet,
    "save-settings": () => {
      const name = document.querySelector("#settingsName")?.value.trim() || "";
      const studentId = document.querySelector("#settingsStudentId")?.value.trim() || "";
      const className = document.querySelector("#settingsClass")?.value.trim() || "";
      const department = document.querySelector("#settingsDepartment")?.value.trim();
      const role = document.querySelector("#settingsRole")?.value || "普通学生";
      const gender = document.querySelector("#settingsGender")?.value || "";
      const advanceMinutes = Number(document.querySelector("#settingsAdvance")?.value || 0);
      if (!department) {
        document.querySelector("#settingsDepartment")?.focus();
        showToast("请输入学院全称", "error");
        return;
      }
      state.settings.name = name;
      state.settings.studentId = studentId;
      state.settings.className = className;
      state.settings.department = department;
      state.settings.role = role;
      state.settings.gender = gender;
      state.settings.advanceMinutes = Math.max(0, Math.min(120, advanceMinutes));
      saveState();
      closeSheet();
      showToast("设置已保存");
    },
    "open-meeting": () => {
      const task = state.tasks.find((item) => item.id === id);
      if (task?.meetingUrl) window.open(task.meetingUrl, "_blank", "noopener,noreferrer");
    },
    "change-sort": () => {
      sortMode = sortMode === "smart" ? "time" : sortMode === "time" ? "priority" : "smart";
      saveState();
      render();
    },
    "export-data": exportData,
    "clear-data": () => {
      pendingConfirmAction = () => {
        state = {
    version: 4,
          tasks: [],
          settings: {
            ...state.settings,
            lastFilter: "today",
          },
        };
        activeFilter = "today";
        saveState();
        closeSheet();
        render();
        showToast("本地任务已清空");
      };
      openSheet({
        title: "清空所有任务？",
        subtitle: "该操作无法撤销",
        content: `<p style="margin:0;color:var(--ink-soft);line-height:1.7">建议先导出备份。所有任务和完成记录都会从当前设备删除。</p>`,
        footer: `
          <button class="ghost-button" type="button" data-action="close-sheet">取消</button>
          <button class="danger-button" type="button" data-action="confirm-delete">${icon("trash-2")} 确认清空</button>
        `,
      });
    },
  };

  actions[action]?.();
}

document.addEventListener("click", (event) => {
  const filterButton = event.target.closest("[data-filter]");
  if (filterButton) {
    activeFilter = filterButton.dataset.filter;
    saveState();
    render();
    return;
  }

  const actionElement = event.target.closest("[data-action]");
  if (actionElement) {
    event.preventDefault();
    event.stopPropagation();
    handleAction(actionElement);
  }
});

document.querySelector("#openPaste").addEventListener("click", openPasteSheet);
document.querySelector("#openSettings").addEventListener("click", openSettingsSheet);

sheetBackdrop.addEventListener("click", closeSheet);

document.querySelector("#importData").addEventListener("change", (event) => {
  const file = event.target.files?.[0];
  event.target.value = "";
  if (file) importData(file);
});

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && sheetRoot.classList.contains("is-open")) closeSheet();
});

document.addEventListener("focusout", (event) => {
  if (event.target.matches?.("[data-time-input]")) {
    event.target.value = normalizeTimeValue(event.target.value);
  }
});

window.addEventListener("focus", render);
window.setInterval(() => {
  if (!sheetRoot.classList.contains("is-open")) render();
}, 60000);

if (!isNativeApp && !isStandaloneWeb && "serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js").catch((error) => {
      console.warn("离线缓存注册失败", error);
    });
  });
}

saveState();
render();

    </script>
  </body>
</html>
